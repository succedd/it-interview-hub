<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Test</title></head>
<body>
  <div id="app">{{ message }}</div>
  <script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
  <script>
    const { createApp, ref } = Vue;
    const app = createApp({
      setup() {
        const message = ref('Hello from Vue!');
        return { message };
      }
    });
    app.mount('#app');
  </script>
</body>
</html>
